name: release-npm

# The only workflow that publishes to npm. It ships `@tai42/jq-studio` on a
# version tag. release-please.yml raises the version PR that bumps package.json
# and carries the release notes; merging it tags, and that tag lands here.
#
# Trigger: push of a v* tag whose version must equal the package version.
#
# Auth: the NPM_TOKEN repo secret (granular, @tai42-scoped) via NODE_AUTH_TOKEN.
# `--provenance` links each published version to this workflow run; `id-token:
# write` enables it (and npm Trusted Publishing later, if configured).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Assert tag matches the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          v=$(node -p "require('./package.json').version")
          if [ "$v" != "$tag" ]; then
            echo "::error::package version ${v} != tag ${tag}"; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # The same gates ci.yml runs, re-verified against the tagged commit, so a
      # published version only ever ships code that typechecked, linted and tested
      # clean and produced a valid dist.
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
