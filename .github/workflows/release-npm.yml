name: release-npm

# The only workflow that publishes to npm. It ships `@tai42/jq-studio` on a
# version tag. release-please.yml raises the version PR that bumps package.json
# and carries the release notes; merging it tags, and that tag lands here.
#
# Trigger: push of a v* tag whose version must equal the package version.
#
# Auth: the NPM_TOKEN repo secret (granular, @tai42-scoped) via NODE_AUTH_TOKEN.
# `--provenance` links each published version to this workflow run; `id-token:
# write` enables it (and npm Trusted Publishing later, if configured).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Assert tag matches the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          v=$(node -p "require('./package.json').version")
          if [ "$v" != "$tag" ]; then
            echo "::error::package version ${v} != tag ${tag}"; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # The same gates ci.yml runs, re-verified against the tagged commit, so a
      # published version only ever ships code that typechecked, linted and tested
      # clean and produced a valid dist.
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  # Plugin rebuild hook: a published jq-studio release pokes babelfish, whose
  # sdk-update lane repins packages/flows to this version and rebuilds the studio
  # plugin bundle. The payload names the package so that shared lane repins jq-studio
  # (not the studio SDK it also serves). Fork runs carry no token and skip.
  notify-babelfish:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BABELFISH_DISPATCH_TOKEN: ${{ secrets.TAI_BABELFISH_DISPATCH_TOKEN }}
    steps:
      - name: Trigger the babelfish sdk-update rebuild
        if: env.BABELFISH_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ env.BABELFISH_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/babelfish
          event-type: sdk-release
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "tag": "${{ github.ref_name }}",
              "package": "@tai42/jq-studio"
            }
