name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release run at a time; never cancel an in-flight release PR update.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release PR branch; create the tag + GitHub Release
      pull-requests: write # open and update the release PR
    steps:
      # A PAT (not GITHUB_TOKEN) so the release PR triggers CI and the tag it
      # creates on merge triggers release-npm.yml — refs written by GITHUB_TOKEN
      # do not fire workflows. Falls back to GITHUB_TOKEN if the PAT is unset.
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
