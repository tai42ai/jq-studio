name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the push/PR as a version-only bump (a release-please train branch, or
  # a diff that only touches CHANGELOG.md, .release-please-manifest.json, and the
  # version fields of package manifests). The heavy browser e2e lane gates on this
  # output so a release train and the version-bump merge to main do not re-run it
  # for a change that alters no shipped code. Fail-safe: any case it cannot classify
  # leaves version_only=false, so the heavy lane runs.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      version_only: ${{ steps.classify.outputs.version_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          emit() { echo "version_only=$1" >> "$GITHUB_OUTPUT"; echo "version_only=$1"; }

          # A release-please train branch only ever carries version + changelog bumps.
          if [[ "${HEAD_REF}" == release-please--branches--* ]]; then
            emit true; exit 0
          fi

          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE_SHA}"; head="${PR_HEAD_SHA}" ;;
            push) base="${PUSH_BEFORE}"; head="${GITHUB_SHA}" ;;
            *) emit false; exit 0 ;;
          esac

          # No usable base (branch creation, force-push, first push) => run heavy.
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then emit false; exit 0; fi
          if ! git rev-parse -q --verify "${base}^{commit}" >/dev/null; then emit false; exit 0; fi

          mapfile -t files < <(git diff --name-only "${base}" "${head}")
          if [[ ${#files[@]} -eq 0 ]]; then emit false; exit 0; fi

          version_only=true
          for f in "${files[@]}"; do
            [[ -z "${f}" ]] && continue
            case "${f}" in
              CHANGELOG.md|*/CHANGELOG.md|.release-please-manifest.json) continue ;;
            esac
            # Every added/removed content line in this file must be a version stamp.
            while IFS= read -r line; do
              content="${line:1}"
              if printf '%s' "${content}" | grep -Eq '^[[:space:]]*version[[:space:]]*=[[:space:]]*"[^"]*"[[:space:]]*$'; then continue; fi
              if printf '%s' "${content}" | grep -Eq '^[[:space:]]*(version|appVersion)[[:space:]]*:'; then continue; fi
              if printf '%s' "${content}" | grep -Eq '^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"[^"]*",?[[:space:]]*$'; then continue; fi
              case "${content}" in *x-release-please-version*) continue ;; esac
              version_only=false; break
            done < <(git diff --unified=0 "${base}" "${head}" -- "${f}" | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' || true)
            [[ "${version_only}" == false ]] && break
          done

          emit "${version_only}"

  # Typecheck, lint, format, the full vitest suite (incl. the jq corpus), and the
  # library build with its independence + relative-URL assertions.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Upload dist
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: dist
          path: dist
          retention-days: 1

  # Real browser end-to-end: mount the SHIPPED artifact in a bare Vite page (no
  # host framework) and drive it through the real wasm worker.
  e2e:
    needs: [changes, verify]
    if: ${{ needs.changes.outputs.version_only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the library (the artifact the e2e page imports)
        run: pnpm build
      - name: Install e2e deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Install Playwright (chromium)
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e
        working-directory: e2e
        run: pnpm test
      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
